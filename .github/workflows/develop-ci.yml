name: Develop CI (Deep)

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  ci:
    name: Common CI
    uses: ./.github/workflows/ci-common.yml
    with:
      upload_client_artifact: true

  integration_tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Placeholder
        run: |
          echo "TODO: add integration test command(s)"

  smoke_tests:
    name: Staging Smoke Tests
    runs-on: ubuntu-latest
    needs: integration_tests
    timeout-minutes: 10
    env:
      STAGING_URL: ${{ vars.STAGING_URL }}
    steps:
      - name: Wait for staging health
        run: |
          if [ -z "$STAGING_URL" ]; then
            echo "STAGING_URL is not set."
            exit 1
          fi

          HEALTH_URL="${STAGING_URL%/}/api/health"
          echo "Checking $HEALTH_URL"

          for i in {1..5}; do
            status=$(curl -sS -o /tmp/health.json -w "%{http_code}" "$HEALTH_URL" || true)
            if [ "$status" = "200" ]; then
              echo "Staging is healthy."
              cat /tmp/health.json || true
              exit 0
            fi
            echo "Waiting for staging... ($i/5)"
            sleep 10
          done

          echo "Staging did not become healthy in time."
          exit 1

  approve_candidate:
    name: Manual Approval
    runs-on: ubuntu-latest
    needs: smoke_tests
    environment:
      name: staging
    steps:
      - name: Approval checkpoint
        run: echo "Staging approved."

  candidate_release:
    name: Create Candidate Release
    runs-on: ubuntu-latest
    needs: approve_candidate
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create draft candidate release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="rc-$SHORT_SHA"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Skipping."
            exit 0
          fi

          gh release create "$TAG" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
