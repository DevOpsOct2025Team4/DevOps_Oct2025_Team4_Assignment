name: Develop CI (Deep)

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  ci:
    name: Common CI
    uses: ./.github/workflows/ci-common.yml
    with:
      upload_client_artifact: true

  integration_tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Placeholder
        run: |
          echo "TODO: add integration test command(s)"

  migrate_staging:
    name: Run Staging DB Migrations
    runs-on: ubuntu-latest
    needs: integration_tests
    environment:
      name: staging
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install server deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements.txt

      - name: Alembic upgrade
        working-directory: server
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "STAGING_DATABASE_URL is not set."
            exit 1
          fi
          alembic upgrade head

  smoke_tests:
    name: Staging Smoke Tests
    runs-on: ubuntu-latest
    needs: migrate_staging
    timeout-minutes: 10
    environment:
      name: staging
    env:
      STAGING_URL: ${{ vars.STAGING_URL }}
    steps:
      - name: Wait for staging health
        run: |
          if [ -z "$STAGING_URL" ]; then
            echo "STAGING_URL is not set."
            exit 1
          fi

          HEALTH_URL="${STAGING_URL%/}/api/health"
          echo "Checking $HEALTH_URL"

          for i in {1..5}; do
            status=$(curl -sS --connect-timeout 5 --max-time 5 -o /tmp/health.json -w "%{http_code}" "$HEALTH_URL" || true)
            if [ "$status" = "200" ]; then
              echo "Staging is healthy."
              cat /tmp/health.json || true
              exit 0
            fi
            echo "Waiting for staging... ($i/5)"
            sleep 10
          done

          echo "Staging did not become healthy in time."
          exit 1

  approve_candidate:
    name: Manual Approval
    runs-on: ubuntu-latest
    needs: smoke_tests
    environment:
      name: review
    steps:
      - name: Approval checkpoint
        run: echo "Staging approved."

  promote_main:
    name: Merge to Main & Draft Release
    runs-on: ubuntu-latest
    needs: approve_candidate
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find or create develop -> main PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin develop
          DEVELOP_SHA=$(git rev-parse origin/develop)
          if [ "$DEVELOP_SHA" != "$GITHUB_SHA" ]; then
            echo "Develop moved since this workflow started."
            echo "Current develop head: $DEVELOP_SHA"
            echo "Workflow SHA: $GITHUB_SHA"
            exit 1
          fi

          PR_NUMBER=$(gh pr list --base main --head develop --state open --json number,headRefOid --jq ".[] | select(.headRefOid==\"$DEVELOP_SHA\") | .number" | head -n 1)
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No open develop -> main PR found for $DEVELOP_SHA. Creating one..."
            gh pr create \
              --base main \
              --head develop \
              --title "Promote develop to main ($DEVELOP_SHA)" \
              --body "Automated promotion after staging approval."
            PR_NUMBER=$(gh pr list --base main --head develop --state open --json number,headRefOid --jq ".[] | select(.headRefOid==\"$DEVELOP_SHA\") | .number" | head -n 1)
            if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
              echo "Failed to create PR."
              exit 1
            fi
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh pr merge "$PR_NUMBER" --merge

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Create version tag and draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main --tags
          git checkout main
          git reset --hard origin/main

          BASE_VERSION=$(node -p "require('./package.json').version")
          IFS='.' read -r MAJOR MINOR _ <<< "$BASE_VERSION"
          if [ -z "$MAJOR" ] || [ -z "$MINOR" ]; then
            echo "Invalid version format in package.json: $BASE_VERSION"
            exit 1
          fi

          LATEST_MATCHING_TAG=$(git tag --list "v${MAJOR}.${MINOR}.*" --sort=-v:refname | head -n 1)
          if [ -n "$LATEST_MATCHING_TAG" ]; then
            PATCH="${LATEST_MATCHING_TAG#v${MAJOR}.${MINOR}.}"
            if ! [[ "$PATCH" =~ ^[0-9]+$ ]]; then
              echo "Invalid matching tag format: $LATEST_MATCHING_TAG"
              exit 1
            fi
            NEXT_PATCH=$((PATCH + 1))
          else
            NEXT_PATCH=0
          fi

          TAG="v${MAJOR}.${MINOR}.${NEXT_PATCH}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Skipping."
            exit 0
          fi

          git tag "$TAG"
          git push origin "$TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Skipping."
            exit 0
          fi
          gh release create "$TAG" --draft --title "$TAG" --generate-notes
