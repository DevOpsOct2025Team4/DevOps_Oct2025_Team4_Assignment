name: Auto Tag Release

on:
  push:
    branches:
      - main

jobs:
  tag_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Create next patch tag
        id: tag
        run: |
          git fetch --tags
          BASE_VERSION=$(node -p "require('./package.json').version")
          IFS='.' read -r MAJOR MINOR _ <<< "$BASE_VERSION"
          if [ -z "$MAJOR" ] || [ -z "$MINOR" ]; then
            echo "Invalid version format in package.json: $BASE_VERSION"
            exit 1
          fi

          LATEST_MATCHING_TAG=$(git tag --list "v${MAJOR}.${MINOR}.*" --sort=-v:refname | head -n 1)
          if [ -n "$LATEST_MATCHING_TAG" ]; then
            PATCH="${LATEST_MATCHING_TAG#v${MAJOR}.${MINOR}.}"
            if ! [[ "$PATCH" =~ ^[0-9]+$ ]]; then
              echo "Invalid matching tag format: $LATEST_MATCHING_TAG"
              exit 1
            fi
            NEXT_PATCH=$((PATCH + 1))
          else
            NEXT_PATCH=0
          fi

          TAG="v${MAJOR}.${MINOR}.${NEXT_PATCH}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Skipping."
            exit 0
          fi

          git tag "$TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Trigger staging deploy
        if: ${{ steps.tag.outputs.tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-staging.yml -f tag="${{ steps.tag.outputs.tag }}"
