name: Promote Candidate Release

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    if: startsWith(github.event.release.tag_name, 'rc-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find or create develop -> main PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin develop

          TARGET_REF="${{ github.event.release.target_commitish }}"
          TARGET_SHA=$(git rev-parse "${TARGET_REF}^{commit}" 2>/dev/null || true)
          if [ -z "$TARGET_SHA" ]; then
            echo "Unable to resolve release target: $TARGET_REF"
            exit 1
          fi

          DEVELOP_SHA=$(git rev-parse origin/develop)
          if [ "$TARGET_SHA" != "$DEVELOP_SHA" ]; then
            echo "Release target ($TARGET_SHA) is not the current develop head ($DEVELOP_SHA)."
            echo "Refuse to merge to avoid promoting unreviewed commits."
            exit 1
          fi

          PR_NUMBER=$(gh pr list --base main --head develop --state open --json number,headRefOid --jq ".[] | select(.headRefOid==\"$DEVELOP_SHA\") | .number" | head -n 1)
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No open develop -> main PR found for $DEVELOP_SHA. Creating one..."
            TAG="${{ github.event.release.tag_name }}"
            gh pr create \
              --base main \
              --head develop \
              --title "Promote develop to main ($TAG)" \
              --body "Automated promotion from candidate release $TAG."
            PR_NUMBER=$(gh pr list --base main --head develop --state open --json number,headRefOid --jq ".[] | select(.headRefOid==\"$DEVELOP_SHA\") | .number" | head -n 1)
            if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
              echo "Failed to create PR."
              exit 1
            fi
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh pr merge "$PR_NUMBER" --merge

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Create version tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main --tags
          git checkout main
          git reset --hard origin/main

          BASE_VERSION=$(node -p "require('./package.json').version")
          IFS='.' read -r MAJOR MINOR _ <<< "$BASE_VERSION"
          if [ -z "$MAJOR" ] || [ -z "$MINOR" ]; then
            echo "Invalid version format in package.json: $BASE_VERSION"
            exit 1
          fi

          LATEST_MATCHING_TAG=$(git tag --list "v${MAJOR}.${MINOR}.*" --sort=-v:refname | head -n 1)
          if [ -n "$LATEST_MATCHING_TAG" ]; then
            PATCH="${LATEST_MATCHING_TAG#v${MAJOR}.${MINOR}.}"
            if ! [[ "$PATCH" =~ ^[0-9]+$ ]]; then
              echo "Invalid matching tag format: $LATEST_MATCHING_TAG"
              exit 1
            fi
            NEXT_PATCH=$((PATCH + 1))
          else
            NEXT_PATCH=0
          fi

          TAG="v${MAJOR}.${MINOR}.${NEXT_PATCH}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Skipping."
            exit 0
          fi

          git tag "$TAG"
          git push origin "$TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Skipping."
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --generate-notes
