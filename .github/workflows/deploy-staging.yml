name: Deploy Staging

on:
  push:
    tags:
      - "v*"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: staging
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          git fetch --tags
          TAG="$GITHUB_REF_NAME"
          if [ -z "$TAG" ]; then
            echo "No tag found to deploy."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout tag
        run: git checkout "${{ steps.tag.outputs.tag }}"

      - name: Deploy to staging
        run: |
          echo "Deploying tag ${{ steps.tag.outputs.tag }} to staging..."
          echo "TODO: replace with your staging deploy command"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Skipping."
            exit 0
          fi
          gh release create "$TAG" --draft --title "$TAG" --generate-notes
