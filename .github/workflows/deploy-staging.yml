name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy (e.g. develop or a tag)
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: staging
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          git fetch --tags --prune
          REF="$INPUT_REF"
          if [ -z "$REF" ]; then
            echo "No ref found to deploy."
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout ref
        env:
          REF: ${{ steps.tag.outputs.ref }}
        run: git checkout "$REF"

      - name: Deploy to staging
        env:
          REF: ${{ steps.tag.outputs.ref }}
        run: |
          echo "Deploying ref $REF to staging..."
          echo "TODO: replace with your staging deploy command"
