name: PR Security

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read
  security-events: write

# ------------------- SAST -------------------
jobs:
  codeql:
    name: SAST (CodeQL security-extended)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript, python]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          output: sarif-results
          upload: true
      - name: Fail on CodeQL findings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, json, sys
          def sev_score(val):
            if val is None:
              return None
            if isinstance(val, (int, float)):
              return float(val)
            if isinstance(val, str):
              s = val.strip().lower()
              if s in ("critical",):
                return 9.0
              if s in ("high",):
                return 7.0
              if s in ("medium", "moderate"):
                return 4.0
              if s in ("low", "info", "informational", "note"):
                return 0.0
              try:
                return float(s)
              except ValueError:
                return None
            if isinstance(val, dict):
              for k in ("score", "cvss", "cvss_v3", "cvss_v2", "value"):
                if k in val:
                  score = sev_score(val.get(k))
                  if score is not None:
                    return score
              return None
            if isinstance(val, list):
              scores = [sev_score(v) for v in val]
              scores = [s for s in scores if s is not None]
              return max(scores, default=None)
            return None

          def is_high(result, rule):
            for source in (result.get("properties") or {}, rule.get("properties") or {}):
              for key in ("security-severity", "securitySeverity", "security_severity", "severity"):
                score = sev_score(source.get(key))
                if score is not None:
                  return score >= 7.0
            level = (result.get("level") or rule.get("defaultConfiguration", {}).get("level") or "").lower()
            if level in ("critical", "high", "error"):
              return True
            return False

          files = glob.glob("sarif-results/**/*.sarif", recursive=True)
          if not files:
            files = glob.glob("**/*.sarif", recursive=True)
          if not files:
            print("No CodeQL SARIF files found")
            sys.exit(1)
          total = 0
          high = 0
          for path in files:
            with open(path, "r", encoding="utf-8") as fh:
              data = json.load(fh)
            for run in data.get("runs", []) or []:
              rules = {r.get("id"): r for r in (run.get("tool", {}).get("driver", {}).get("rules", []) or []) if r.get("id")}
              for result in run.get("results", []) or []:
                total += 1
                rule = rules.get(result.get("ruleId"), {})
                if is_high(result, rule):
                  high += 1
          print(f"CodeQL SARIF findings: total={total} high_or_critical={high}")
          if high > 0:
            sys.exit(1)
          PY

  # ------------------- SCA -------------------
  sca_js:
    name: SCA (JS) - pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: pnpm audit (prod)
        run: pnpm audit --prod --audit-level high

  sca_python:
    name: SCA (Python) - pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
      - name: pip-audit (High/Critical only)
        shell: bash
        run: |
          set -euo pipefail
          pip-audit -r server/requirements.txt -f json > pip-audit.json || true
          if [ ! -f pip-audit.json ]; then
            echo "pip-audit did not produce JSON output."
            exit 1
          fi
          python - <<'PY'
          import json, sys
          def sev_score(val):
            if val is None:
              return None
            if isinstance(val, (int, float)):
              return float(val)
            if isinstance(val, str):
              s = val.strip().lower()
              if s in ("critical",):
                return 9.0
              if s in ("high",):
                return 7.0
              if s in ("medium", "moderate"):
                return 4.0
              if s in ("low", "info", "informational", "note"):
                return 0.0
              try:
                return float(s)
              except ValueError:
                return None
            if isinstance(val, dict):
              for k in ("score", "cvss", "cvss_v3", "cvss_v2", "value"):
                if k in val:
                  score = sev_score(val.get(k))
                  if score is not None:
                    return score
              return None
            if isinstance(val, list):
              scores = [sev_score(v) for v in val]
              scores = [s for s in scores if s is not None]
              return max(scores, default=None)
            return None

          with open("pip-audit.json", "r", encoding="utf-8") as fh:
            data = json.load(fh)

          if isinstance(data, dict):
            packages = data.get("dependencies") or data.get("packages") or []
          elif isinstance(data, list):
            packages = data
          else:
            packages = []

          total = 0
          high = 0
          unknown = 0

          for pkg in packages:
            vulns = pkg.get("vulns") or pkg.get("vulnerabilities") or []
            for vuln in vulns:
              total += 1
              score = None
              for key in ("severity", "cvss", "cvss_v3", "cvss_v2", "advisory"):
                if key in vuln:
                  score = sev_score(vuln.get(key))
                  if score is not None:
                    break
              if score is None and isinstance(vuln.get("advisory"), dict):
                score = sev_score(vuln["advisory"].get("severity"))
              if score is None:
                unknown += 1
              elif score >= 7.0:
                high += 1

          print(f"pip-audit vulnerabilities: total={total} high_or_critical={high} unknown_severity={unknown}")
          if high > 0:
            sys.exit(1)
          if unknown > 0:
            print("Severity missing for some vulnerabilities; failing to avoid passing unknown risk.")
            sys.exit(1)
          PY
