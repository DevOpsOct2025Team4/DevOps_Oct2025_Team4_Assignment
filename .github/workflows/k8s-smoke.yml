name: K8s Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - develop

permissions:
  contents: read
  packages: write

jobs:
  k8s_smoke:
    name: Build, Deploy, Smoke Test (K8s)
    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io
      BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/devops-assignment-backend
      FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/devops-assignment-frontend
      TAG: ${{ github.sha }}
      NAMESPACE: devops-assignment

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.TAG }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: client/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.TAG }}
            ${{ env.FRONTEND_IMAGE }}:latest

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: devops-assignment

      - name: Create namespace
        run: |
          kubectl get ns $NAMESPACE || kubectl create ns $NAMESPACE

      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY GitHub secrets."
            exit 1
          fi

      - name: Create image pull secret
        run: |
          kubectl -n $NAMESPACE create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n $NAMESPACE patch serviceaccount default \
            -p '{"imagePullSecrets":[{"name":"ghcr-pull"}]}'

      - name: Create backend secret
        run: |
          kubectl -n $NAMESPACE create secret generic backend-secret \
            --from-literal=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --from-literal=SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            --from-literal=SUPABASE_DIRECT="${{ secrets.SUPABASE_DIRECT }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply manifests
        run: |
          kubectl -n $NAMESPACE apply -f k8s

      - name: Set images
        run: |
          kubectl -n $NAMESPACE set image deployment/backend \
            backend=${BACKEND_IMAGE}:${TAG}
          kubectl -n $NAMESPACE set image deployment/frontend \
            frontend=${FRONTEND_IMAGE}:${TAG}

      - name: Wait for rollout
        run: |
          kubectl -n $NAMESPACE rollout status statefulset/db --timeout=300s
          kubectl -n $NAMESPACE rollout status deployment/backend --timeout=300s
          kubectl -n $NAMESPACE rollout status deployment/frontend --timeout=300s

      - name: Smoke test (health)
        run: |
          kubectl -n $NAMESPACE run k8s-smoke --rm -i --restart=Never \
            --image=curlimages/curl:8.7.1 \
            --command -- sh -c "curl -sf http://backend:5000/api/health && curl -sf http://frontend/api/health"
