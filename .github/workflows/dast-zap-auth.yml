name: DAST (ZAP Authenticated)

on:
  workflow_call:
    inputs:
      staging_web_url:
        description: "Base URL for the staging web app (optional override)"
        required: false
        type: string
      zap_login_url:
        description: "Login endpoint URL (JSON login) (optional override)"
        required: false
        type: string
      zap_username_field:
        description: "JSON field name for username/email"
        required: false
        type: string
      zap_password_field:
        description: "JSON field name for password"
        required: false
        type: string
      zap_logged_in_regex:
        description: "Regex indicating a logged-in response"
        required: false
        type: string
      zap_logged_out_regex:
        description: "Regex indicating a logged-out response"
        required: false
        type: string
      spider_minutes:
        description: "Spider max duration in minutes"
        required: false
        default: 5
        type: number
      passive_minutes:
        description: "Passive scan wait duration in minutes"
        required: false
        default: 5
        type: number
      fail_on_warning:
        description: "Fail job on ZAP warnings"
        required: false
        default: false
        type: boolean
    secrets:
      zap_username:
        required: true
      zap_password:
        required: true

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  zap_authenticated:
    runs-on: ubuntu-latest
    environment: staging
    env:
      STAGING_WEB_URL: ${{ inputs.staging_web_url || vars.STAGING_WEBSITE_URL }}
      ZAP_LOGIN_URL: ${{ inputs.zap_login_url || format('{0}/api/login', vars.STAGING_URL) }}
      ZAP_USERNAME_FIELD: ${{ inputs.zap_username_field || vars.ZAP_USERNAME_FIELD }}
      ZAP_PASSWORD_FIELD: ${{ inputs.zap_password_field || vars.ZAP_PASSWORD_FIELD }}
      ZAP_LOGGED_IN_REGEX: ${{ inputs.zap_logged_in_regex || vars.ZAP_LOGGED_IN_REGEX }}
      ZAP_LOGGED_OUT_REGEX: ${{ inputs.zap_logged_out_regex || vars.ZAP_LOGGED_OUT_REGEX }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare ZAP workspace
        run: |
          set -euo pipefail
          mkdir -p .zap
          if [ ! -f .zap/rules.tsv ]; then
            touch .zap/rules.tsv
          fi
          chmod -R a+rwx "$GITHUB_WORKSPACE"

      - name: Validate inputs
        env:
          STAGING_WEB_URL: ${{ env.STAGING_WEB_URL }}
          ZAP_LOGIN_URL: ${{ env.ZAP_LOGIN_URL }}
          ZAP_USERNAME_FIELD: ${{ env.ZAP_USERNAME_FIELD }}
          ZAP_PASSWORD_FIELD: ${{ env.ZAP_PASSWORD_FIELD }}
          ZAP_LOGGED_IN_REGEX: ${{ env.ZAP_LOGGED_IN_REGEX }}
          ZAP_LOGGED_OUT_REGEX: ${{ env.ZAP_LOGGED_OUT_REGEX }}
        run: |
          set -euo pipefail
          if [ -z "${STAGING_WEB_URL:-}" ]; then
            echo "staging_web_url is required"; exit 1
          fi
          if [ -z "${ZAP_LOGIN_URL:-}" ]; then
            echo "zap_login_url is required"; exit 1
          fi
          if [ -z "${ZAP_USERNAME_FIELD:-}" ] || [ -z "${ZAP_PASSWORD_FIELD:-}" ]; then
            echo "username/password field names are required"; exit 1
          fi
          if [ -z "${ZAP_LOGGED_IN_REGEX:-}" ] || [ -z "${ZAP_LOGGED_OUT_REGEX:-}" ]; then
            echo "logged-in/out regex are required"; exit 1
          fi

      - name: Generate ZAP automation plan
        env:
          STAGING_WEB_URL: ${{ env.STAGING_WEB_URL }}
          ZAP_LOGIN_URL: ${{ env.ZAP_LOGIN_URL }}
          ZAP_USERNAME_FIELD: ${{ env.ZAP_USERNAME_FIELD }}
          ZAP_PASSWORD_FIELD: ${{ env.ZAP_PASSWORD_FIELD }}
          ZAP_LOGGED_IN_REGEX: ${{ env.ZAP_LOGGED_IN_REGEX }}
          ZAP_LOGGED_OUT_REGEX: ${{ env.ZAP_LOGGED_OUT_REGEX }}
          ZAP_USERNAME: ${{ secrets.zap_username }}
          ZAP_PASSWORD: ${{ secrets.zap_password }}
          SPIDER_MINUTES: ${{ inputs.spider_minutes }}
          PASSIVE_MINUTES: ${{ inputs.passive_minutes }}
        run: |
          set -euo pipefail
          python -c 'import os, pathlib; data = pathlib.Path(".zap/zap.template.yaml").read_text(); repl = {
            "__STAGING_WEB_URL__": os.environ["STAGING_WEB_URL"],
            "__ZAP_LOGIN_URL__": os.environ["ZAP_LOGIN_URL"],
            "__ZAP_USERNAME_FIELD__": os.environ["ZAP_USERNAME_FIELD"],
            "__ZAP_PASSWORD_FIELD__": os.environ["ZAP_PASSWORD_FIELD"],
            "__ZAP_LOGGED_IN_REGEX__": os.environ["ZAP_LOGGED_IN_REGEX"],
            "__ZAP_LOGGED_OUT_REGEX__": os.environ["ZAP_LOGGED_OUT_REGEX"],
            "__ZAP_USERNAME__": os.environ["ZAP_USERNAME"],
            "__ZAP_PASSWORD__": os.environ["ZAP_PASSWORD"],
            "__SPIDER_MINUTES__": os.environ.get("SPIDER_MINUTES", "5"),
            "__PASSIVE_MINUTES__": os.environ.get("PASSIVE_MINUTES", "5"),
          };
          for k, v in repl.items():
            data = data.replace(k, v);
          pathlib.Path("zap.yaml").write_text(data)'
          chmod a+rw zap.yaml

      - name: ZAP Baseline Scan (authenticated)
        id: zap_scan
        continue-on-error: true
        env:
          STAGING_WEB_URL: ${{ env.STAGING_WEB_URL }}
          FAIL_ON_WARNING: ${{ inputs.fail_on_warning }}
        run: |
          set -euo pipefail

          if [ -z "${STAGING_WEB_URL:-}" ]; then
            echo "staging_web_url is required"; exit 1
          fi

          if [ ! -f .zap/rules.tsv ]; then
            touch .zap/rules.tsv
          fi

          chmod -R a+rwx "$GITHUB_WORKSPACE"

          ZAP_ARGS="-t ${STAGING_WEB_URL} -c .zap/rules.tsv -J report_json.json -w report_md.md -r report_html.html"
          if [ "${FAIL_ON_WARNING}" != "true" ]; then
            ZAP_ARGS="${ZAP_ARGS} -I"
          fi

          docker pull ghcr.io/zaproxy/zaproxy:stable -q
          docker run --rm --user 0 \
            -v "$GITHUB_WORKSPACE:/zap/wrk/:rw" \
            -w /zap/wrk \
            --network=host \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py ${ZAP_ARGS}

      - name: Upload ZAP reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: zapscan-reports
          path: |
            report_json.json
            report_md.md
            report_html.html
          if-no-files-found: warn

      - name: Fail if ZAP scan failed
        if: ${{ steps.zap_scan.outcome == 'failure' }}
        run: |
          echo "ZAP scan failed. See uploaded reports."
          exit 1
