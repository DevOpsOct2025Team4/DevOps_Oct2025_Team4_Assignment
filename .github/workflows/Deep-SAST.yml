name: Deep SAST (CodeQL)
# Done after a merges to main. Runs Security & Quality for CodeQL for a deep analysis.

on:
  #schedule:
  # - cron: Plans to run every week. Wont be active for this assignment XXX
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

# ------------------- SAST via CodeQL -------------------
jobs:
  codeql:
    name: CodeQL Analyze
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: [javascript, python]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  # ------------------- SAST via Semgrep -------------------
  semgrep:
    name: Semgrep SAST (OWASP Top 10)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep (SARIF)
        uses: semgrep/semgrep-action@v1
        with:
          config: "p/owasp-top-ten" #For broad coverage
          generateSarif: "1"

      - name: Upload Semgrep SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
