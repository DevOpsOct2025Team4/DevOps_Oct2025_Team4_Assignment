global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "devops-app-monitor"

scrape_configs:
  - job_name: "flask-app"
    static_configs:
      - targets: ["host.docker.internal:5000"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]
