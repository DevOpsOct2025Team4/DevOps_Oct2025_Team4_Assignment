apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: devops-assignment
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-assignment
      tier: frontend
  template:
    metadata:
      labels:
        app: devops-assignment
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: devops-assignment-frontend:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
