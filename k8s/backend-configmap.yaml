apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  labels:
    app: devops-assignment
    tier: backend
data:
  PORT: "5000"
  HOST: "0.0.0.0"
  ENV: "dev"
  DATABASE_URL: "postgres://app:app@db:5432/app"
  LOCALDB_URL: "postgres://app:app@db:5432/app"
  LOCALDB_DIRECT: "postgres://app:app@db:5432/app"
  SUPABASE_BUCKET: "UserUploads"
  SUPABASE_STORAGE_PUBLIC: "true"
  MAX_UPLOAD_MB: "10"
