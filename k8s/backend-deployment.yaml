apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: devops-assignment
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-assignment
      tier: backend
  template:
    metadata:
      labels:
        app: devops-assignment
        tier: backend
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z db 5432; do
                echo "waiting for db";
                sleep 2;
              done
      containers:
        - name: backend
          image: devops-assignment-backend:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
